<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room 3 Real-Time Operations Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.5rem;
      color: #94a3b8;
      font-weight: 500;
    }

    /* Grid Layout */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .bed-card {
      background-color: #1e293b;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 15px;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .bed-card:hover {
      border-color: #38bdf8;
    }

    .bed-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .bed-title {
      font-size: 1.2rem;
      font-weight: bold;
    }

    .tags {
      display: flex;
      gap: 5px;
    }

    .tag {
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }

    .tag-fall { background-color: #ef4444; color: white; }
    .tag-female { background-color: #ec4899; color: white; }
    .tag-waiting { background-color: #f59e0b; color: white; }

    .bed-body {
      margin: 10px 0;
    }

    .therapist-name {
      font-size: 0.9rem;
      color: #cbd5e1;
    }

    .treatment-item {
      font-size: 1.1rem;
      font-weight: 600;
      color: #38bdf8;
    }

    .timer-display {
      font-size: 1.8rem;
      font-weight: bold;
      text-align: right;
      font-family: monospace;
    }

    /* States */
    .state-idle { border-color: #22c55e; }
    .state-idle .status-dot { color: #22c55e; }
    
    .state-pre-alert {
      border-color: #f59e0b;
      animation: pulse-orange 1.5s infinite;
    }

    .state-complete {
      border-color: #ef4444;
      animation: pulse-red 1s infinite;
    }

    @keyframes pulse-orange {
      0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); }
      100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
    }

    @keyframes pulse-red {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      border: 1px solid #475569;
    }

    .modal h2 { margin-bottom: 15px; }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; color: #94a3b8; }
    .form-group select, .form-group input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      background: #0f172a;
      border: 1px solid #334155;
      color: white;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-primary { background: #0284c7; color: white; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-secondary { background: #475569; color: white; }
  </style>
</head>
<body>

  <header>
    <h1>點擊床位/設備設定治療項目與時間</h1>
  </header>

  <div class="dashboard-grid" id="grid-container">
    <!-- 床位與設備動態生成 -->
  </div>

  <!-- Modal 設定彈窗 -->
  <div class="modal-overlay" id="setup-modal">
    <div class="modal">
      <h2 id="modal-title">設定床位</h2>
      
      <div class="form-group">
        <label>治療師代號</label>
        <select id="modal-therapist">
          <option value="008 W Chung">008 W Chung</option>
          <option value="001 Staff A">001 Staff A</option>
          <option value="002 Staff B">002 Staff B</option>
        </select>
      </div>

      <!-- 治療項目 (手單車會自動隱藏) -->
      <div class="form-group" id="treatment-items-group">
        <label>選擇治療項目</label>
        <select id="modal-treatment">
          <option value="Zimmer">Zimmer</option>
          <option value="運動">運動</option>
          <option value="HP">HP</option>
          <option value="TENS">TENS</option>
        </select>
      </div>

      <!-- 治療時間 -->
      <div class="form-group" id="duration-group">
        <label>治療時間 (分鐘)</label>
        <select id="modal-duration">
          <option value="5">5分鐘</option>
          <option value="10" selected>10分鐘</option>
          <option value="15">15分鐘</option>
          <option value="20">20分鐘</option>
        </select>
      </div>

      <!-- 特殊需求設定 (手單車會自動隱藏助理選項) -->
      <div class="form-group">
        <label>特殊需求設定</label>
        <div id="assistant-option-group">
          <label><input type="checkbox" id="modal-fall-risk"> ⚠️ 此病人有跌倒風險</label><br>
          <label><input type="checkbox" id="modal-female-only"> 🌸 需女性處理</label>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" onclick="startTimer()">開始治療</button>
        <button class="btn btn-danger" onclick="resetBed()">清空床位</button>
        <button class="btn btn-secondary" onclick="closeModal()">取消</button>
      </div>
    </div>
  </div>

  <script>
    // 設備與床位佈局資料結構
    const layoutData = {
      'bed-4': { name: '4 號床', type: 'bed' },
      'monark-4': { name: 'Monark Bike', type: 'equipment', defaultDuration: 10 },
      
      'bed-5': { name: '5 號床', type: 'bed' },
      'nustep-5': { name: 'NuStep', type: 'equipment', defaultDuration: 15 },
      
      'bed-6': { name: '6 號床', type: 'bed' },
      'hand-bike-6': { 
        name: '手單車', 
        type: 'equipment_fixed', 
        requiresAssistant: false, 
        hasTreatmentOptions: false, 
        defaultDuration: 10 
      }
    };

    // 狀態紀錄
    let bedStates = {};
    let activeKey = null;

    // 初始化頁面
    function initDashboard() {
      const container = document.getElementById('grid-container');
      container.innerHTML = '';

      Object.keys(layoutData).forEach(key => {
        const item = layoutData[key];
        bedStates[key] = bedStates[key] || {
          therapist: '',
          treatment: '',
          timeLeft: 0,
          totalTime: 0,
          isFallRisk: false,
          isFemaleOnly: false,
          timerId: null
        };

        const card = document.createElement('div');
        card.className = 'bed-card state-idle';
        card.id = `card-${key}`;
        card.onclick = () => openModal(key);

        card.innerHTML = `
          <div class="bed-header">
            <span class="bed-title">${item.name}</span>
            <div class="tags" id="tags-${key}">
              <span class="status-dot">● 空置</span>
            </div>
          </div>
          <div class="bed-body">
            <div class="therapist-name" id="therapist-${key}">--</div>
            <div class="treatment-item" id="treatment-${key}">--</div>
          </div>
          <div class="timer-display" id="timer-${key}">00:00</div>
        `;
        container.appendChild(card);
      });

      // 自動檢查 URL 中的 NFC 參數 (?bed=xxx)
      checkUrlParamsAndAutoOpen();
    }

    // 開啟 Modal 設定
    function openModal(key) {
      activeKey = key;
      const item = layoutData[key];
      document.getElementById('modal-title').innerText = `設定 ${item.name}`;

      // 6 號床右邊「手單車」的特定隱藏與預設邏輯
      if (key === 'hand-bike-6') {
        document.getElementById('treatment-items-group').style.display = 'none';
        document.getElementById('assistant-option-group').style.display = 'none';
        document.getElementById('modal-duration').value = "10";
      } else {
        document.getElementById('treatment-items-group').style.display = 'block';
        document.getElementById('assistant-option-group').style.display = 'block';
      }

      document.getElementById('setup-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('setup-modal').style.display = 'none';
    }

    // 開始倒數
    function startTimer() {
      const state = bedStates[activeKey];
      const item = layoutData[activeKey];

      state.therapist = document.getElementById('modal-therapist').value;
      state.treatment = (activeKey === 'hand-bike-6') ? '手單車訓練' : document.getElementById('modal-treatment').value;
      state.isFallRisk = document.getElementById('modal-fall-risk').checked;
      state.isFemaleOnly = document.getElementById('modal-female-only').checked;
      
      const durationMin = parseInt(document.getElementById('modal-duration').value);
      state.timeLeft = durationMin * 60;
      state.totalTime = state.timeLeft;

      if (state.timerId) clearInterval(state.timerId);

      state.timerId = setInterval(() => {
        state.timeLeft--;
        updateCardUI(activeKey);
        if (state.timeLeft <= 0) {
          clearInterval(state.timerId);
        }
      }, 1000);

      updateCardUI(activeKey);
      closeModal();
    }

    // 清空床位
    function resetBed() {
      const state = bedStates[activeKey];
      if (state.timerId) clearInterval(state.timerId);
      
      bedStates[activeKey] = {
        therapist: '',
        treatment: '',
        timeLeft: 0,
        totalTime: 0,
        isFallRisk: false,
        isFemaleOnly: false,
        timerId: null
      };

      updateCardUI(activeKey);
      closeModal();
    }

    // 更新 UI 畫面與 30 秒預警邏輯
    function updateCardUI(key) {
      const state = bedStates[key];
      const card = document.getElementById(`card-${key}`);
      const tagsContainer = document.getElementById(`tags-${key}`);
      const therapistEl = document.getElementById(`therapist-${key}`);
      const treatmentEl = document.getElementById(`treatment-${key}`);
      const timerEl = document.getElementById(`timer-${key}`);

      if (state.timeLeft <= 0 && state.totalTime === 0) {
        card.className = 'bed-card state-idle';
        tagsContainer.innerHTML = `<span class="status-dot">● 空置</span>`;
        therapistEl.innerText = '--';
        treatmentEl.innerText = '--';
        timerEl.innerText = '00:00';
        return;
      }

      // 更新 Tag
      let tagsHTML = '';
      if (state.isFallRisk) tagsHTML += `<span class="tag tag-fall">⚠️ 防跌</span>`;
      if (state.isFemaleOnly) tagsHTML += `<span class="tag tag-female">🌸 限女</span>`;
      tagsContainer.innerHTML = tagsHTML;

      therapistEl.innerText = state.therapist;
      treatmentEl.innerText = state.treatment;

      // 時間格式化 (MM:SS)
      const mins = Math.floor(state.timeLeft / 60).toString().padStart(2, '0');
      const secs = (state.timeLeft % 60).toString().padStart(2, '0');
      timerEl.innerText = `${mins}:${secs}`;

      // 30 秒預警與完成提示狀態
      if (state.timeLeft <= 30 && state.timeLeft > 0) {
        card.className = 'bed-card state-pre-alert';
      } else if (state.timeLeft === 0) {
        card.className = 'bed-card state-complete';
        timerEl.innerText = '時間到';
      } else {
        card.className = 'bed-card';
      }
    }

    // 讀取 NFC 帶入的 URL 參數 (?bed=xxx) 自動開啟 Modal
    function checkUrlParamsAndAutoOpen() {
      const urlParams = new URLSearchParams(window.location.search);
      const bedParam = urlParams.get('bed');
      if (bedParam && layoutData[bedParam]) {
        setTimeout(() => openModal(bedParam), 300);
      }
    }

    // 啟動頁面
    window.onload = initDashboard;
  </script>
</body>
</html>
