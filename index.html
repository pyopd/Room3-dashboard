<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room 3 實時看板</title>
  
  <!-- 引入 Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 12px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      text-align: center;
      margin-bottom: 12px;
    }
    header h1 {
      font-size: 1.4rem;
      color: #94a3b8;
    }

    /* 佈局容器 */
    .floorplan-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-width: 1200px;
    }

    .row-block {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* 床位與裝備卡片 */
    .card {
      background-color: #1e293b;
      border: 2px solid #334155;
      border-radius: 8px;
      padding: 10px;
      min-height: 90px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      position: relative;
    }
    .card:hover { border-color: #38bdf8; }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-title {
      font-size: 1rem;
      font-weight: bold;
    }

    .tags { display: flex; gap: 4px; }
    .tag { font-size: 0.7rem; padding: 2px 5px; border-radius: 4px; font-weight: bold; }
    .tag-fall { background-color: #ef4444; color: white; }
    .tag-female { background-color: #ec4899; color: white; }
    .status-idle-text { color: #22c55e; font-size: 0.8rem; }

    .card-body { margin: 4px 0; }
    .therapist-info { font-size: 0.8rem; color: #cbd5e1; }
    .treatment-info { font-size: 0.95rem; font-weight: bold; color: #38bdf8; }
    .timer-info { font-size: 1.4rem; font-weight: bold; text-align: right; font-family: monospace; }

    /* 狀態顏色變換與警報 */
    .state-idle { border-color: #334155; }
    .state-pre-alert {
      border-color: #f59e0b;
      animation: pulse-orange 1.5s infinite;
    }
    .state-complete {
      border-color: #ef4444;
      animation: pulse-red 1s infinite;
    }

    @keyframes pulse-orange {
      0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
      70% { box-shadow: 0 0 0 8px rgba(245, 158, 11, 0); }
      100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
    }
    @keyframes pulse-red {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    /* Modal 彈窗 */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75); display: none;
      justify-content: center; align-items: center; z-index: 1000;
    }
    .modal {
      background: #1e293b; padding: 20px; border-radius: 12px;
      width: 90%; max-width: 400px; border: 1px solid #475569;
    }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; margin-bottom: 4px; color: #94a3b8; font-size: 0.85rem; }
    .form-group select {
      width: 100%; padding: 8px; border-radius: 6px;
      background: #0f172a; border: 1px solid #334155; color: white;
    }
    .btn-group { display: flex; gap: 8px; margin-top: 16px; }
    .btn { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-primary { background: #0284c7; color: white; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-secondary { background: #475569; color: white; }
  </style>
</head>
<body>

  <header>
    <h1>Room 3 實時營運看板</h1>
  </header>

  <!-- Floorplan 容器 -->
  <div class="floorplan-container" id="main-floorplan">
    <div id="bed-rows-container" style="display: flex; flex-direction: column; gap: 8px;"></div>
    <div id="row-21-25" class="row-block" style="margin-top: 12px;"></div>
  </div>

  <!-- Modal 設定彈窗 -->
  <div class="modal-overlay" id="setup-modal">
    <div class="modal">
      <h2 id="modal-title" style="margin-bottom: 12px;">設定床位</h2>
      
      <div class="form-group">
        <label>治療師代號</label>
        <select id="modal-therapist">
          <option value="008 W Chung">008 W Chung</option>
          <option value="001 Staff A">001 Staff A</option>
          <option value="002 Staff B">002 Staff B</option>
        </select>
      </div>

      <div class="form-group" id="treatment-select-container">
        <label>選擇治療項目</label>
        <select id="modal-treatment">
          <option value="Zimmer">Zimmer</option>
          <option value="運動">運動</option>
          <option value="HP">HP</option>
          <option value="TENS">TENS</option>
        </select>
      </div>

      <div class="form-group" id="duration-select-container">
        <label>治療時間 (分鐘)</label>
        <select id="duration-select">
          <option value="5">5分鐘</option>
          <option value="10" selected>10分鐘</option>
          <option value="15">15分鐘</option>
          <option value="20">20分鐘</option>
        </select>
      </div>

      <div class="form-group" id="assistant-container">
        <label>特殊需求設定</label>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label><input type="checkbox" id="modal-fall-risk"> ⚠️ 此病人有跌倒風險</label>
          <label><input type="checkbox" id="modal-female-only"> 🌸 需女性處理</label>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" onclick="saveToFirebase()">開始治療</button>
        <button class="btn btn-danger" onclick="resetBedInFirebase()">清空床位</button>
        <button class="btn btn-secondary" onclick="closeModal()">取消</button>
      </div>
    </div>
  </div>

  <script>
    // 1. Firebase 設定
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. 床位與右側對應裝備結構（已更新 4, 5, 6 號床右邊）
    const bedEquipmentPairs = [
      { bed: 1, eqKey: null, eqName: '' },
      { bed: 2, eqKey: null, eqName: '' },
      { bed: 3, eqKey: null, eqName: '' },
      { bed: 4, eqKey: 'monark', eqName: 'Monark Bike' }, // 4號床右邊 -> Monark Bike
      { bed: 5, eqKey: 'nustep', eqName: 'NuStep' },       // 5號床右邊 -> NuStep
      { bed: 6, eqKey: 'handbike', eqName: '手單車' },     // 6號床右邊 -> 手單車
      { bed: 7, eqKey: null, eqName: '' },
      { bed: 8, eqKey: null, eqName: '' },
      { bed: 9, eqKey: null, eqName: '' },
      { bed: 10, eqKey: null, eqName: '' }
    ];

    let currentActiveKey = null;
    let localState = {};

    // 3. 動態渲染 Floorplan DOM 結構
    function buildFloorplanDOM() {
      const rowsContainer = document.getElementById('bed-rows-container');
      rowsContainer.innerHTML = '';

      // 渲染 1-10 號床及右側欄位
      bedEquipmentPairs.forEach(pair => {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'row-block';

        // 床位 Cell
        const bedKey = `bed-${pair.bed}`;
        rowDiv.appendChild(createCardDOM(bedKey, `${pair.bed} 號床`));

        // 右側 Equipment Cell
        if (pair.eqKey) {
          rowDiv.appendChild(createCardDOM(pair.eqKey, pair.eqName));
        } else {
          const emptyDiv = document.createElement('div');
          rowDiv.appendChild(emptyDiv);
        }

        rowsContainer.appendChild(rowDiv);
      });

      // 渲染 21 - 25 床位/大椅子區塊
      const row2125 = document.getElementById('row-21-25');
      row2125.innerHTML = '';
      [21, 22, 23, 24, 25].forEach(num => {
        const title = (num === 25) ? '25 號大椅子' : `${num} 號床`;
        row2125.appendChild(createCardDOM(`bed-${num}`, title));
      });
    }

    // 創建單一 Card DOM 元素
    function createCardDOM(key, name) {
      const card = document.createElement('div');
      card.className = 'card state-idle';
      card.id = `card-${key}`;
      card.onclick = () => openModal(key, name);

      card.innerHTML = `
        <div class="card-header">
          <span class="card-title">${name}</span>
          <div class="tags" id="tags-${key}">
            <span class="status-idle-text">● 空置</span>
          </div>
        </div>
        <div class="card-body">
          <div class="therapist-info" id="therapist-${key}">--</div>
          <div class="treatment-info" id="treatment-${key}">--</div>
        </div>
        <div class="timer-info" id="timer-${key}">00:00</div>
      `;
      return card;
    }

    // 4. 開啟 Modal（包含手單車專屬邏輯判斷）
    function openModal(key, name) {
      currentActiveKey = key;
      document.getElementById('modal-title').innerText = `設定 ${name || key}`;

      // 👈 手單車專屬邏輯判斷：隱藏助理與治療項目，預設 10 分鐘
      if (key === 'handbike') {
        document.getElementById('treatment-select-container').style.display = 'none';
        document.getElementById('assistant-container').style.display = 'none';
        document.getElementById('duration-select').value = "10";
      } else {
        document.getElementById('treatment-select-container').style.display = 'block';
        document.getElementById('assistant-container').style.display = 'block';
      }

      document.getElementById('setup-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('setup-modal').style.display = 'none';
    }

    // 5. Firebase 寫入與移除
    function saveToFirebase() {
      if (!currentActiveKey) return;

      const therapist = document.getElementById('modal-therapist').value;
      const duration = parseInt(document.getElementById('duration-select').value);
      
      const treatment = (currentActiveKey === 'handbike') ? '手單車訓練' : document.getElementById('modal-treatment').value;
      const isFallRisk = (currentActiveKey === 'handbike') ? false : document.getElementById('modal-fall-risk').checked;
      const isFemaleOnly = (currentActiveKey === 'handbike') ? false : document.getElementById('modal-female-only').checked;

      const startTime = Date.now();
      const endTime = startTime + (duration * 60 * 1000);

      db.ref('beds/' + currentActiveKey).set({
        therapist: therapist,
        treatment: treatment,
        duration: duration,
        startTime: startTime,
        endTime: endTime,
        isFallRisk: isFallRisk,
        isFemaleOnly: isFemaleOnly,
        status: 'active'
      });

      closeModal();
    }

    function resetBedInFirebase() {
      if (!currentActiveKey) return;
      db.ref('beds/' + currentActiveKey).remove();
      closeModal();
    }

    // 6. 實時監聽 Firebase
    db.ref('beds').on('value', snapshot => {
      const data = snapshot.val() || {};
      localState = data;
      refreshAllUI();
    });

    function refreshAllUI() {
      // 更新所有 1-10 號及裝備
      bedEquipmentPairs.forEach(pair => {
        updateCardUI(`bed-${pair.bed}`, localState[`bed-${pair.bed}`]);
        if (pair.eqKey) {
          updateCardUI(pair.eqKey, localState[pair.eqKey]);
        }
      });
      // 更新 21-25 號床
      [21, 22, 23, 24, 25].forEach(num => {
        updateCardUI(`bed-${num}`, localState[`bed-${num}`]);
      });
    }

    // 7. 更新 UI 卡片與倒數預警
    function updateCardUI(key, data) {
      const card = document.getElementById(`card-${key}`);
      if (!card) return;

      const tagsContainer = document.getElementById(`tags-${key}`);
      const therapistEl = document.getElementById(`therapist-${key}`);
      const treatmentEl = document.getElementById(`treatment-${key}`);
      const timerEl = document.getElementById(`timer-${key}`);

      if (!data || data.status !== 'active') {
        card.className = 'card state-idle';
        tagsContainer.innerHTML = `<span class="status-idle-text">● 空置</span>`;
        therapistEl.innerText = '--';
        treatmentEl.innerText = '--';
        timerEl.innerText = '00:00';
        return;
      }

      // Tags
      let tagsHTML = '';
      if (data.isFallRisk) tagsHTML += `<span class="tag tag-fall">⚠️ 防跌</span>`;
      if (data.isFemaleOnly) tagsHTML += `<span class="tag tag-female">🌸 限女</span>`;
      tagsContainer.innerHTML = tagsHTML;

      therapistEl.innerText = data.therapist;
      treatmentEl.innerText = data.treatment;

      // 倒數計算
      const secondsLeft = Math.max(0, Math.floor((data.endTime - Date.now()) / 1000));
      const mins = Math.floor(secondsLeft / 60).toString().padStart(2, '0');
      const secs = (secondsLeft % 60).toString().padStart(2, '0');
      timerEl.innerText = `${mins}:${secs}`;

      // 預警判斷 (30秒預警/完成)
      if (secondsLeft <= 30 && secondsLeft > 0) {
        card.className = 'card state-pre-alert';
      } else if (secondsLeft === 0) {
        card.className = 'card state-complete';
        timerEl.innerText = '時間到';
      } else {
        card.className = 'card';
      }
    }

    // 每秒本地驅動倒數
    setInterval(refreshAllUI, 1000);

    // 8. 支援 NFC URL 參數開啟 (?bed=xxx)
    function checkUrlParamsAndAutoOpen() {
      const urlParams = new URLSearchParams(window.location.search);
      const bedParam = urlParams.get('bed');
      if (bedParam) {
        setTimeout(() => openModal(bedParam), 500);
      }
    }

    // 初始化執行
    window.onload = () => {
      buildFloorplanDOM();
      checkUrlParamsAndAutoOpen();
    };
  </script>
</body>
</html>
